name: Android Print Agent

on:
  push:
    branches: [implementation/foundation-v1]
    paths:
      - 'android-print-agent/**'
      - '.github/workflows/android-print-agent.yml'
  pull_request:
    branches: [implementation/foundation-v1]
    paths:
      - 'android-print-agent/**'
      - '.github/workflows/android-print-agent.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-print-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
